# Placeholder VirtualMachine. Disk image digest is REPLACE.
# Namespace "example" is intentional. Do not point containerDisk at a public registry in air-gap.
# Fact: default virt storage class required for CDI imports
# https://docs.redhat.com/en/documentation/openshift_container_platform/4.18/html/virtualization/storage
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: example-vm
  namespace: example
  labels:
    app: example
spec:
  running: false
  template:
    metadata:
      labels:
        kubevirt.io/domain: example-vm
    spec:
      domain:
        cpu:
          cores: 1
          model: host-passthrough
        devices:
          disks:
            - name: rootdisk
              disk:
                bus: virtio
          interfaces:
            - name: default
              masquerade: {}
        resources:
          requests:
            memory: 2Gi
      networks:
        - name: default
          pod: {}
      volumes:
        - name: rootdisk
          dataVolume:
            name: example-vm-root
  dataVolumeTemplates:
    - metadata:
        name: example-vm-root
      spec:
        source:
          registry:
            url: "docker://registry.example.internal:8443/example/example-guest@sha256:REPLACE"
        storage:
          storageClassName: REPLACE-virt-default
          resources:
            requests:
              storage: 30Gi
