# Placeholder ImageTagMirrorSet for tag-based pulls (catalog tags, etc.).
# Fact: oc-mirror v2 generates ITMS when images are mirrored by tag.
# https://docs.redhat.com/en/documentation/openshift_container_platform/4.18/html/disconnected_environments/about-installing-oc-mirror-v2
---
apiVersion: config.openshift.io/v1
kind: ImageTagMirrorSet
metadata:
  name: example-tag-mirrors
spec:
  imageTagMirrors:
    - source: registry.redhat.io/redhat
      mirrors:
        - registry.example.internal:8443/redhat
      mirrorSourcePolicy: NeverContactSource
