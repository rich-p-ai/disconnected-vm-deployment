# Placeholder CatalogSource for disconnected OLM Classic.
# Replace the digest with the mirrored index digest from oc-mirror cluster-resources.
# Fact: https://docs.redhat.com/en/documentation/openshift_container_platform/4.18/html/disconnected_environments/olm-restricted-networks
---
apiVersion: operators.coreos.com/v1alpha1
kind: CatalogSource
metadata:
  name: redhat-operators-disconnected
  namespace: openshift-marketplace
spec:
  sourceType: grpc
  displayName: Red Hat Operators (disconnected example)
  publisher: example
  image: registry.example.internal:8443/redhat/redhat-operator-index@sha256:REPLACE
  grpcPodConfig:
    securityContextConfig: restricted
  updateStrategy:
    registryPoll:
      interval: 24h
